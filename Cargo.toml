[workspace]
resolver = "2"
members = [
    "clients/shared/rust/cabinhug-core",
    "clients/shared/rust/cabinhug-net",
    "clients/shared/rust/cabinhug-media",
    "clients/shared/rust/cabinhug-voice",
    "clients/shared/rust/cabinhug-tts",
    "clients/shared/rust/cabinhug-telemetry",
    "clients/shared/rust/cabinhug-vision",
    "clients/mobile/src-tauri",
    "clients/cockpit/src-tauri",
    "standalone/host",
    "standalone/app/src-tauri",
]
# vendor 进来的上游 crate 不是本仓的包，不作为 workspace 成员编译。
exclude = ["clients/shared/rust/vendor/webrtc-audio-processing-sys-2.1.0"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# AEC 依赖的上游补丁（ACR-010）。
#
# 原因：`webrtc-audio-processing-sys` 的 build.rs 用 `cfg!(target_os = "macos")`
# 判断平台，而 build script 是为宿主编译的——在 Mac 上交叉编 iOS 时它为真，于是
# 把 `-mmacos-version-min=11.0` 传给 iOS 编译，clang++ 拒绝该参数，`aarch64-apple-ios`
# 无法编译。cockpit 运行在 iPad 上，这条路必须可编译。补丁改读 CARGO_CFG_TARGET_OS。
#
# 采用 vendor 而不指向 GitHub fork：新克隆与 CI 无需额外步骤即可编译。
# vendor 自包含、离线可编、CI 不需要额外拉取；代价是 5.2MB 上游源码一次性入库。
#
# 删除条件：上游合入等价修复并发版后，删掉本段与 clients/shared/rust/vendor/ 整个目录，
# 依赖回到 crates.io 版本。补丁与待提的 PR 正文在 clients/shared/rust/vendor/README.md。
[patch.crates-io]
webrtc-audio-processing-sys = { path = "clients/shared/rust/vendor/webrtc-audio-processing-sys-2.1.0" }
