[project]
name = "cabinhug-vision-infer"
version = "0.1.0"
description = "Cabinhug 线上只推理服务：与端上同一份指示灯检测 ONNX，接口同 vision-trainer 的 POST /predict（ACR-050）"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "onnxruntime>=1.18",
  "pillow>=10",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# 只锁发布满两周以上的版本。镜像构建走国内 PyPI 镜像，镜像源有同步延迟，
# 锁到最新版时镜像上可能还没有该版本。升级依赖时把这个日期往后挪，仍保持"至少两周前"。
exclude-newer = "2026-09-05T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_infer"]
