# infra/docker/compose.yml —— 所有环境共用的服务定义。
# 环境差异（端口 / 镜像 tag / 副本 / 资源）写进 envs/<env>/compose.override.yml，变量来自 envs/<env>/.env。
# 服务名要与 内部开发指引「目标与端口」表、部署脚本头部 `# services:` 一致。按 accepted 的 ARCH 填——模板只给形状。
name: placeholder   # 实际 project 名由适配器的 --project-name 决定（<项目>-<env>），这里的值不生效
services: {}
