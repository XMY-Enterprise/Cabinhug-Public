# Cabinhug 本地开发基础设施（§9 数据/存储层）
#
# 宿主机 5432 已被其它项目占用，PG 映射到 55433；Redis 映射到 56379。
# DATABASE_URL 示例（enterprise/backend/shared/db/.env）：
#   postgresql://carlife:carlife@localhost:55433/carlife
#
# 启动：docker compose -f infra/docker-compose.yml up -d

#
# Mem0 没有独立容器：`mem0ai` 的 TS OSS 形态是进程内库，不是服务。
# `Memory` 类在 enterprise/backend/shared/memory 里直接 new，向量库/LLM/embedder 都是
# 它的可插拔后端。部署 Mem0 即部署它的向量库，这里复用这台 PG（§13-11 方案 A），
# 备份归入同一条 pg_dump，不为不可重建的数据另建备份机制。
#
# 镜像用 pgvector/pgvector:pg16 而非 postgres:16：官方 drop-in，
# 同一个 PG 16、同一套 PGDATA 布局，只多预装 vector 扩展。
# 换镜像不影响既有数据（命名卷 carlife-pg-data 不变）。

# 项目名显式写死，不让 Compose 按目录名派生。
# 派生规则是「取 compose 文件所在目录名」，`infra` 这类通用名容易与别的仓库撞名；
# 撞名后两个项目在 Docker 看来是同一个，`up` 会 Recreate 另一个项目的 PG 和 Redis。
#
# 卷名也带项目前缀：项目名不同，同一份 PG 会挂到不同的卷上，而 container_name 固定，
# Compose 会让位重建容器并挂上另一个卷，表现为数据回到旧状态且不报错。
# 所以下面每个卷也都显式写死 name，去掉项目前缀。
name: cabinhug

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cabinhug-postgres
    environment:
      POSTGRES_USER: carlife
      POSTGRES_PASSWORD: carlife
      POSTGRES_DB: carlife
    ports:
      - "55433:5432"
    volumes:
      - carlife-pg-data:/var/lib/postgresql/data
      # 首次建库时自动建扩展。已有数据卷不会重跑这个目录，
      # 所以 infra/scripts/pgvector-setup.sh 是幂等的显式补齐路径，二者都要有。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carlife -d carlife"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 图像知识库的向量检索（ACR-030）。
  #
  # 手册图的向量存这里而不在库内 pgvector：2560 维超过 pgvector 的 HNSW 上限 2000 维
  # （`column cannot have more than 2000 dimensions for hnsw index`），只能全表顺序扫描，
  # 3116 行实测 307 ms 且随手册数量线性增长。
  #
  # 向量由我们自己算（DashScope `qwen3-vl-embedding`），Qdrant 只做存储与检索，
  # 不绑任何 vectorizer；Weaviate / Marqo 的内置推理用不上，因此不选。
  #
  # 只绑 127.0.0.1：它没有鉴权（本机开发档），不能出现在局域网上。
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: cabinhug-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - carlife-qdrant-data:/qdrant/storage
    healthcheck:
      # 官方镜像里没有 curl / wget，用它自带的 bash 打开 /dev/tcp 探端口；
      # 换成 curl 会一直 unhealthy。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 对象存储（§9）。S3 兼容，本地用 MinIO。
  #
  # 它存的是用户拍的照片与留档音频，可能在事后作为与修理厂交涉的证据。
  # 因此保留期与对话历史一致，不接入记忆衰减（F-09-13）：记忆可以淡出，证据不行。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cabinhug-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carlife
      MINIO_ROOT_PASSWORD: carlife-secret
    ports:
      - "59000:9000"   # S3 API
      - "59001:9001"   # 控制台
    volumes:
      - carlife-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cabinhug-redis
    ports:
      - "56379:6379"
    # 不挂卷时数据落在匿名卷上：redis 官方镜像的 Dockerfile 自带 `VOLUME /data`，
    # 默认的 RDB 快照（save 3600 1 / 300 100 / 60 10000）照常写 /data/dump.rdb。
    # restart 时数据还在，容器重建（--force-recreate / 换 tag / down 后再 up）则换一个
    # 新匿名卷，旧数据成为读不到的孤儿卷，表现为缓存全空。
    # ⑤环境缓存的 TTL 有两周量级（目的地推荐 / 景区导览简报），每次重建丢缓存就要
    # 重新付出这些调用。因此用命名卷 + 显式 name（理由见文件顶部）。
    #
    # 不开 AOF：⑤是可重建的缓存，RDB 最坏丢 60 秒写入的代价远小于 AOF 的写放大。
    # 前提是 Redis 里只有可重建的数据。
    volumes:
      - carlife-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 本地 ASR（ACR-006 定容器形态，ACR-007 换引擎与模型）。只有显式启用 profile
  #   才会创建，避免默认开发依赖在没有模型时被一个约 1GB 的旁车拖成“启动失败”。
  #   引擎是 llama.cpp llama-server，模型 Qwen3-ASR-0.6B GGUF（主模型 + mmproj 两个
  #   文件）；模型由 setup 工具下载到宿主机缓存，再由启动编排经 Docker CLI 同步进
  #   具名卷；容器只读挂载，不依赖 Docker Desktop 的 File Sharing。
  #   转写端点：POST /v1/audio/transcriptions（multipart，回 {text}）。
  local-asr:
    profiles: ["local-asr"]
    image: cabinhug-local-asr:llama-v0.3.0
    pull_policy: build
    build:
      context: ..
      dockerfile: infra/images/Dockerfile.llama-asr
      args:
        LLAMA_VERSION: v0.3.0
        LLAMA_SOURCE_SHA256: d94c02d86db22d68692f6bb5b3854763d5091e52142868dc7251995517c666d1
    container_name: cabinhug-local-asr
    ports:
      - "8795:8795"
    volumes:
      - type: volume
        source: carlife-whisper-models
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  # 显式 name = 不带项目前缀。改这里等于换库。
  carlife-pg-data:
    name: carlife-pg-data
  carlife-minio-data:
    name: carlife-minio-data
  carlife-redis-data:
    name: carlife-redis-data
  carlife-qdrant-data:
    name: carlife-qdrant-data
  carlife-whisper-models:
    name: carlife-whisper-models
    external: true
