# 车机端 / 手机端的浏览器演示站。
#
# 与 nginx.web.conf 的区别：不代理 /console（那是运营后台的接口面，
# 客户端演示站不该有）。这里只做单页应用的静态托管。
server {
  listen 80;
  # IPv6 也要听：容器内 `localhost` 在 Alpine 上先解析成 ::1，只听 IPv4 的话
  # healthcheck 里的 wget 会拿到 Connection refused，容器被判 unhealthy，
  # 尽管从外面访问正常。
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 两端的 vite 都没设 base，产物引用的是绝对路径 /assets/…，
  # 所以只能挂在端口根路径上，不能挂子路径。

  # 高德服务接口的代理（ACR-019）。演示站里前端把 `_AMapSecurityConfig.serviceHost`
  # 指向自己的 origin（浏览器形态下没有 Tauri 桥、拿不到端上设置里的网关地址），
  # 所以这条必须转给网关，由它追加安全密钥。
  #
  # 缺少这条时没有明确报错：`location /` 的 try_files 会把这些请求当成前端路由，
  # 回一份 index.html，SDK 解析 HTML 失败，路径规划退直线、底图样式不生效。
  #
  # 这里不代理 /v1：演示站没有 Tauri 桥，业务数据走 mock（前端有 isTauriEnv() 守卫）。
  # 只开地图这一条，不在演示站上开放客户端的业务接口面。
  location /_AMapService/ {
    proxy_pass http://gateway:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  # 带哈希文件名的产物可以永久缓存：名字变了就是新文件。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html 不能被缓存。nginx 默认只发 ETag/Last-Modified，浏览器会按启发式规则
  # 直接复用旧副本，而旧 index.html 指向上一版的哈希 JS，访问过的人会一直看到旧界面
  # （强刷后恢复）。所以显式要求每次都回源校验。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
