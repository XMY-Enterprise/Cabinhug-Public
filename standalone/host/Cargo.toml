[package]
name = "cabinhug-standalone-host"
version = "0.1.0"
edition = "2021"
description = "单机版宿主：本机数据库、服务起停、凭据与单机配置（ARCH-002，ACR-061）"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cabinhug-standalone-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.3"
keyring = "4"
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
