# CI 门禁：只接受手动触发（与 e2e.yml、smoke.yml 一致）。基底是 test-cases 技能的 templates/ci.yml。
#
# 不挂在 push / pull_request 上：每次运行都要装 GTK/WebKit 系统库、从源码编译 WebRTC 与
# 两个 Tauri crate，再跑 check:all，一次约 20 分钟；自动触发时持续红在 check:all 且无人跟进，
# 只消耗 Actions 分钟数，起不到门禁作用。
# 触发时机：发版前、合并一批改动后，或需要在干净环境复核 check:all 时，在 Actions 页面手动运行。
# 提交前的快检查仍由 .husky/pre-commit 承担（check:secrets + check:env-example）。
#
# 这里只留一层：
#   unit —— check:all：静态不变量 + typecheck + 全部 workspace 成员的 test/（3000+ 用例）
#           + Rust + 契约。不起服务、不碰外部依赖、不需要任何密钥。
#
# 不在这里的三类：
#   - 端到端（fake 模型 + 本地桩的 e2e:*、playwright）：在 e2e.yml，只接受手动触发。
#     每次 push 都起 PG / Redis、spawn 网关与 runtime 跑四套 e2e 成本过高，unit 已带真库跑全部用例；
#     端到端在发版前或改了编排链路时手动触发。
#   - 建模数据（docs/）的校验：见 内部文档，不进 CI」。
#     这些文档允许存在讨论中的中间态矛盾，不作为流水线门禁。
#   - 真实密钥的冒烟：在 smoke.yml，只接受手动触发。fork 来的 PR 读不到 secrets，
#     挂在这里会使外部贡献者的 PR 全部失败。
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单测与静态门禁（check:all）
    runs-on: ubuntu-latest
    # `check:all` 里的根 `test` 经 with-test-db 总会设上 DATABASE_URL，库测试不走
    # 「没配就跳过」的分支，没有库即失败。CI 提供真库，使 check:all 与本地同义、仓储层被实际验证。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carlife
          POSTGRES_PASSWORD: carlife
          POSTGRES_DB: carlife
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U carlife"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://carlife:carlife@localhost:55433/carlife_test
      CABINHUG_PII_MASTER_KEY: ci-only-pii-key-0123456789abcdef
      CABINHUG_CONFIG_MASTER_KEY: ci-only-not-a-real-key-0123456789abcdef
      # runner 的 14 GB 盘容纳不下「checkout + 两个 Tauri crate 的 debug 产物 + rust-cache」
      # （报 `No space left on device`）。debuginfo 与增量编译产物在 CI 上无用，关掉以缩小 target/。
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      # v4 跑在 Node 20 上，GitHub 已预告弃用，使用 v5。
      - uses: actions/checkout@v5
      # ubuntu runner 预装的 .NET、Android SDK、GHC、boost 等本仓不用，合计 20 GB 以上，编译前删除。
      # df 前后各打一次，便于定位磁盘占用变化。
      - name: 释放 runner 磁盘（删本仓用不到的预装大件）
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # v5 默认开启 package-manager-cache，会在 PATH 上找裸 `pnpm`；本仓的 pnpm 只经
          # corepack 提供，开启时报 `Unable to locate executable file: pnpm`。本仓不用依赖缓存。
          package-manager-cache: false
      # rust-toolchain.toml 钉了版本，装了 rustup 的 runner 会自动就位；
      # check:all 含 test:contract 与 test:rust，两者都要 cargo。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test --workspace` 覆盖两个 src-tauri crate，它们在 Linux 上要 GTK/WebKit
      # 才能编（macOS 用系统框架）。缺系统库时报 `failed to run custom build command for 'glib-sys'`。
      # libasound2-dev 给 cabinhug-media 的音频路径。
      # meson + ninja 是 cabinhug-media 的 webrtc-audio-processing（AEC，ACR-010）从源码编译
      # 所需（`bundled`）；缺失时报 `Failed to execute meson. Do you have it installed?`。
      # 这里只覆盖 Linux/host 路径：iOS 交叉编译需要 Xcode 与 iPhoneOS SDK，CI 不覆盖，
      # 本地验证的判据与命令在 clients/shared/rust/vendor/README.md。
      - name: 装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf \
            meson ninja-build
      # 一律 corepack pnpm：按根 package.json 的 packageManager 拉起锁定版本。
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @cabinhug/db db:generate
      # check:all 里的库测试要有库可连，先把 carlife_test 建出来（幂等）
      - run: corepack pnpm db:test:setup
      - run: corepack pnpm typecheck
      - run: corepack pnpm check:all
